# Pull-request pipeline (F00 US1, FR-004, FR-005). One matrix entry per `pr`-stage gate in
# config/gates.yaml, in the same order as `make check` (tools.gates.local); the parity test keeps
# them equal. The job is named by the gate id, so every gate is its own required status check
# (see docs/runbooks/branch-protection.md). fail-fast is off so every gate runs even when
# another fails (run-all-then-fail). Every action is pinned to a full commit SHA with its version
# in a trailing comment; Dependabot (.github/dependabot.yml) proposes the bumps. The `gate` job holds no cloud credentials. The `plan` job
# (T093) shows the infrastructure change of each environment with a read-only federated identity;
# it never changes anything and is skipped for pull requests from forks.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # [ASSUMPTION]
    defaults:
      run:
        working-directory: EIOS
    strategy:
      fail-fast: false
      matrix:
        gate:
          - lint
          - types
          - coverage
          - contract
          - eval_smoke
          - red_line
          - vuln_scan
          - secret_scan
          - iac_plan
          - infra_policy
          - open_decision_check
          - label_check
          - adr_check
    env:
      EIOS_REQUIRE_TFLINT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: install locked dependencies
        run: uv sync --frozen
      - name: run gate
        run: uv run python -m tools.gates.run_gate ${{ matrix.gate }}
      - name: upload reports and run records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.gate }}
          path: EIOS/evals/reports/
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EIOS/web-prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: EIOS/web-prototype/package-lock.json
      - name: install dependencies
        run: npm ci
      - name: type check
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: test
        run: npm run test

  plan:
    name: plan-${{ matrix.environment }}
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.EIOS_WORKLOAD_IDENTITY_PROVIDER != '' && vars.EIOS_PLAN_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30 # [ASSUMPTION]
    defaults:
      run:
        working-directory: EIOS
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - stage
          - prod-like
    env:
      EIOS_STATE_BUCKET: ${{ vars.EIOS_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: authenticate with read-only federated identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.EIOS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EIOS_PLAN_SERVICE_ACCOUNT }}
      - name: initialise
        run: terraform -chdir=infra/envs/${{ matrix.environment }} init -input=false -backend-config="bucket=$EIOS_STATE_BUCKET"
      - name: show the planned change
        run: terraform -chdir=infra/envs/${{ matrix.environment }} plan -input=false -lock=false -no-color
