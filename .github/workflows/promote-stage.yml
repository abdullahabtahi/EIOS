# Promotion to stage (F00 US2, FR-007). Runs on every merge to the main line; there is no manual
# path and no pull-request trigger, so stage is only ever changed by code that passed review and
# the pull-request gates. Order: Red-Line suites, plan-then-change of the stage environment,
# validation-tier suites against it, then the run records are promoted by tools.gates.promote.
# A failed step stops the job, so a failed run is never promoted.
# Identity is federated (id-token: write); the provider and service account are repository
# variables (placeholders until the identity pool exists, see infra/bootstrap). No stored keys.
# Without them the preflight step announces a warning and promotes nothing (never a silent job
# skip); once the repository variable EIOS_CD_ENABLED is "true" a missing value fails the run.
name: promote-stage

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: promote-stage
  cancel-in-progress: false

jobs:
  promote:
    name: promote-stage
    runs-on: ubuntu-latest
    timeout-minutes: 60 # [ASSUMPTION]
    # The deployer identity is impersonable only under the GitHub environment of the same name
    # (infra/bootstrap/deployers.tf). Stage has no reviewers; it promotes on every merge.
    environment: stage
    defaults:
      run:
        working-directory: EIOS
    permissions:
      contents: read
      id-token: write
    env:
      EIOS_STATE_BUCKET: ${{ vars.EIOS_STATE_BUCKET }}
      EIOS_CORE_IMAGE_DIGEST: ${{ vars.EIOS_STAGE_CORE_IMAGE_DIGEST }}
      EIOS_EDGE_IMAGE_DIGEST: ${{ vars.EIOS_STAGE_EDGE_IMAGE_DIGEST }}
    steps:
      - name: preflight
        env:
          EIOS_CD_ENABLED: ${{ vars.EIOS_CD_ENABLED }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.EIOS_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.EIOS_STAGE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -n "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "CD_CONFIGURED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning title=promote-stage is not configured::nothing was promoted; set EIOS_WORKLOAD_IDENTITY_PROVIDER and EIOS_STAGE_SERVICE_ACCOUNT"
          if [ "$EIOS_CD_ENABLED" = "true" ]; then
            echo "EIOS_CD_ENABLED is true but the cloud configuration is incomplete" >&2
            exit 1
          fi
          echo "CD_CONFIGURED=false" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.CD_CONFIGURED == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: env.CD_CONFIGURED == 'true'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: env.CD_CONFIGURED == 'true'
      - name: authenticate with federated identity
        if: env.CD_CONFIGURED == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.EIOS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EIOS_STAGE_SERVICE_ACCOUNT }}
      - name: install locked dependencies
        if: env.CD_CONFIGURED == 'true'
        run: uv sync --frozen
      - name: red-line suites
        if: env.CD_CONFIGURED == 'true'
        run: uv run python -m evals.cli run --tier red_line --workflow promote-stage
      - name: initialise the stage environment
        if: env.CD_CONFIGURED == 'true'
        run: terraform -chdir=infra/envs/stage init -input=false -backend-config="bucket=$EIOS_STATE_BUCKET"
      - name: change the stage environment
        if: env.CD_CONFIGURED == 'true'
        run: terraform -chdir=infra/envs/stage apply -input=false -auto-approve
      - name: validation suites
        if: env.CD_CONFIGURED == 'true'
        run: uv run python -m evals.cli run --tier validation --workflow promote-stage
      - name: promote passed runs
        if: env.CD_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          args=()
          for digest in "$EIOS_CORE_IMAGE_DIGEST" "$EIOS_EDGE_IMAGE_DIGEST"; do
            if [ -n "$digest" ]; then
              args+=(--image-digest "$digest")
            fi
          done
          uv run python -m tools.gates.promote --workflow promote-stage "${args[@]}"
      - name: upload reports and run records
        if: always() && env.CD_CONFIGURED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-promote-stage
          path: EIOS/evals/reports/
          if-no-files-found: ignore
          retention-days: 90
