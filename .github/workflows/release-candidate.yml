# Release candidate (F00 US2, FR-008, FR-011). The only workflow that runs the sealed tier, and the
# only one that holds the release-candidate identity (a service account distinct from stage and
# prod-like; infra binds it to this workflow file by name). Not triggered by pull requests.
# Order: build the SBOM from the lockfile, run Red-Line and sealed suites under the
# release-candidate workflow identity (each run record carries the SBOM reference), then promote.
# Identity is federated (id-token: write); provider and service account are repository variables.
name: release-candidate

on:
  push:
    tags:
      - "rc-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    name: release-candidate
    if: vars.EIOS_WORKLOAD_IDENTITY_PROVIDER != '' && vars.EIOS_RELEASE_CANDIDATE_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90 # [ASSUMPTION]
    defaults:
      run:
        working-directory: EIOS
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4 # [SPIKE] pin to commit SHA when CI first runs
      - uses: astral-sh/setup-uv@v6 # [SPIKE] pin to commit SHA when CI first runs
      - name: authenticate with federated identity
        uses: google-github-actions/auth@v2 # [SPIKE] pin to commit SHA when CI first runs
        with:
          workload_identity_provider: ${{ vars.EIOS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EIOS_RELEASE_CANDIDATE_SERVICE_ACCOUNT }}
      - name: install locked dependencies
        run: uv sync --frozen
      - name: build the SBOM and run the release-candidate suites
        run: |
          set -euo pipefail
          sbom_ref="$(uv run python -m tools.gates.sbom | tail -n 1)"
          uv run python -m evals.cli run --tier red_line --workflow release-candidate --sbom-ref "$sbom_ref"
          uv run python -m evals.cli run --tier sealed --workflow release-candidate --sbom-ref "$sbom_ref"
      - name: promote passed runs
        run: uv run python -m tools.gates.promote --workflow release-candidate
      - name: upload reports, SBOM and run records
        if: always()
        uses: actions/upload-artifact@v4 # [SPIKE] pin to commit SHA when CI first runs
        with:
          name: reports-release-candidate
          path: EIOS/evals/reports/
          if-no-files-found: ignore
