# Dependency and action updates (CI hardening). Every action is pinned to a full commit SHA with its
# version in a trailing comment; Dependabot reads that comment and proposes SHA + comment bumps.
# One grouped pull request per ecosystem per week keeps review load predictable; every one runs the
# full pull-request gate set before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /EIOS
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python:
        patterns: ["*"]
    # google-adk 2.11.0 caps opentelemetry-api/sdk at 1.42.1, and fastapi 0.142.0 added native
    # OpenTelemetry and so requires opentelemetry >= 1.44. Until ADK relaxes its cap, these three
    # stay behind latest. Remove these entries when pyproject.toml drops the matching bounds.
    ignore:
      - dependency-name: "fastapi"
        versions: [">=0.142.0"]
      - dependency-name: "opentelemetry-api"
        versions: [">1.42.1"]
      - dependency-name: "opentelemetry-sdk"
        versions: [">1.42.1"]

  - package-ecosystem: npm
    directory: /EIOS/web-prototype
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web:
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directories:
      - /EIOS/infra/bootstrap
      - /EIOS/infra/envs/dev
      - /EIOS/infra/envs/stage
      - /EIOS/infra/envs/prod-like
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /EIOS/services/skeleton_core
      - /EIOS/services/skeleton_edge
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      images:
        patterns: ["*"]
