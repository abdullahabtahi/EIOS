<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="610" viewBox="0 0 1060 610" role="img" aria-label="Geospatial assistant: the map sends a question and map context to an ADK loop with a prefetcher, drafter with an origin guard, and assembler that emits view commands; the loop calls geo tools in the governed port, which read geo evidence functions, BigQuery Graph named queries and reference lists; hold proposals and SAR drafts seal an evidence bundle that the intent hub signs."><style>svg{
  --bg: #f4f6f9;
  --surface: #ffffff;
  --fg: #16202e;
  --muted: #566274;
  --line: #d5dce6;
  --edge: #45536a;
  --adk-bg: #e3edff;  --adk: #2c5bcf;
  --det-bg: #e1f3e8;  --det: #1d7646;
  --ext-bg: #eceff4;  --ext: #75839a;
  --gov-bg: #fff0d1;  --gov: #a8620a;
  --geo-bg: #dbf3f1;  --geo: #0c7673;
  --ml-bg:  #efe6fa;  --ml:  #7440b2;
  
  
--font:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;color:var(--edge)}@media (prefers-color-scheme:dark){svg{
    --bg: #0e131b; --surface: #151c27; --fg: #e4eaf3; --muted: #97a3b8; --edge: #9aa7bd;
    --line: #283244;
    --adk-bg: #172746; --adk: #7ea5ff;
    --det-bg: #12301f; --det: #5cc78b;
    --ext-bg: #1c2330; --ext: #8996ac;
    --gov-bg: #38290d; --gov: #f1b44f;
    --geo-bg: #0e2f2e; --geo: #4fcdc6;
    --ml-bg:  #281c3d; --ml:  #b995f2;
    
  }}
svg text { fill: var(--fg); font-family: var(--font); font-size: 12.5px; }
svg .b { font-weight: 600; }
svg .m { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg .l { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg .lc { text-anchor: middle; }
svg .le { text-anchor: end; }
svg rect.n { stroke-width: 1.5; rx: 6; fill: var(--surface); stroke: var(--line); }
svg rect.adk { fill: var(--adk-bg); stroke: var(--adk); }
svg rect.det { fill: var(--det-bg); stroke: var(--det); }
svg rect.ext { fill: var(--ext-bg); stroke: var(--ext); stroke-dasharray: 5 3; }
svg rect.gov { fill: var(--gov-bg); stroke: var(--gov); }
svg rect.geo { fill: var(--geo-bg); stroke: var(--geo); }
svg rect.ml  { fill: var(--ml-bg);  stroke: var(--ml); }
svg rect.frame { fill: none; stroke-dasharray: 6 4; stroke-width: 1.5; rx: 8; }
svg rect.frame.adk { stroke: var(--adk); fill: none; }
svg rect.frame.geo { stroke: var(--geo); fill: none; }
svg rect.frame.ext { stroke: var(--ext); fill: none; }
svg rect.frame.ml { stroke: var(--ml); fill: none; }
svg .e { stroke: currentColor; stroke-width: 1.6; fill: none; }
svg .e.d { stroke-dasharray: 5 4; }
svg .e.back { stroke: var(--gov); color: var(--gov); }
svg .e.ok { stroke: var(--det); color: var(--det); }
svg rect.slow { fill: var(--gov-bg); stroke: var(--gov); stroke-width: 1.5; rx: 4; }
svg rect.seg { fill: var(--adk-bg); stroke: var(--adk); stroke-width: 1.5; rx: 4; }
svg rect.tool { fill: var(--det-bg); stroke: var(--det); stroke-width: 1.5; rx: 4; }
svg rect.bg { fill: var(--ext-bg); stroke: var(--ext); stroke-width: 1.5; stroke-dasharray: 5 3; rx: 4; }
</style><rect width="1060" height="610" fill="var(--surface)"/>
      <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>

      <rect class="n geo" x="20" y="64" width="190" height="136"/>
      <text class="b" x="30" y="84">Geospatial tab · map</text>
      <text class="m" x="30" y="102">views: corridors,</text><text class="m" x="30" y="116">logins, jurisdictions</text>
      <text class="m" x="30" y="134">basis: FATF · EU · Basel</text>
      <text class="m" x="30" y="152">selection: country,</text><text class="m" x="30" y="166">corridor, mismatch,</text><text class="m" x="30" y="180">gateway, account</text>
      <rect class="n geo" x="20" y="230" width="190" height="124"/>
      <text class="b" x="30" y="250">Ask panel · geo-ask.tsx</text>
      <text class="m" x="30" y="268">sends question +</text><text class="m" x="30" y="282">MapContext</text>
      <text class="m" x="30" y="300">applies view_commands</text><text class="m" x="30" y="314">as a URL change</text><text class="m" x="30" y="328">(Back undoes a move)</text>
      <path class="e" d="M115 200V230" marker-end="url(#a4)"/>
      <text class="l" x="123" y="219">selected</text>
      <path class="e" d="M210 268H270" marker-end="url(#a4)"/><text class="l lc" x="240" y="260">ask</text>
      <path class="e ok" d="M270 308H210" marker-end="url(#a4)"/><text class="l lc" x="240" y="324" style="fill:var(--det)">reply</text>

      <rect class="frame adk" x="270" y="52" width="290" height="390"/>
      <text class="b" x="284" y="74">geospatial_assistant · LoopAgent</text>
      <rect class="n det" x="286" y="88" width="258" height="82"/>
      <text class="b" x="298" y="108">Prefetcher</text><text class="m" x="298" y="126">geo_steps(MapContext)</text><text class="m" x="298" y="140">the selected object's tool</text><text class="m" x="298" y="154">runs before the first call</text>
      <rect class="n adk" x="286" y="192" width="258" height="104"/>
      <text class="b" x="298" y="212">drafter · Gemini · 11 tools</text><text class="m" x="298" y="230">GEO_RULES 10–18: geography</text><text class="m" x="298" y="244">is evidence, never a verdict;</text><text class="m" x="298" y="258">state benign readings</text>
      <text class="m" x="298" y="276">before_model_callback =</text><text class="m" x="298" y="290" style="fill:var(--geo)">refuse_by_origin</text>
      <rect class="n det" x="286" y="318" width="258" height="108"/>
      <text class="b" x="298" y="338">assembler</text><text class="m" x="298" y="356">figures, quotes, spelled</text><text class="m" x="298" y="370">counts need a tool value</text>
      <text class="m" x="298" y="388" style="fill:var(--geo)">{{map:kind:id}} kept only if</text><text class="m" x="298" y="402" style="fill:var(--geo)">in map_targets, max 3</text><text class="m" x="298" y="416">→ view_commands</text>
      <path class="e" d="M415 170V192" marker-end="url(#a4)"/><path class="e" d="M415 296V318" marker-end="url(#a4)"/>

      <rect class="frame geo" x="600" y="52" width="210" height="390"/>
      <text class="b" x="614" y="74">GovernedToolPort</text><text class="m" x="614" y="90">geospatial workstation</text>
      <text class="m" x="614" y="114">get_geo_overview</text><text class="m" x="614" y="132">list_geo_leads</text><text class="m" x="614" y="150">get_shared_exit</text><text class="m" x="614" y="168">get_corridor</text><text class="m" x="614" y="186">get_geo_account</text><text class="m" x="614" y="204">get_jurisdiction</text><text class="m" x="614" y="222">get_list_change_impact</text>
      <text class="m" x="614" y="248" style="fill:var(--fg)">+ account dossier</text><text class="m" x="614" y="266" style="fill:var(--gov)">+ hold proposal (propose)</text><text class="m" x="614" y="284" style="fill:var(--gov)">+ SAR draft</text><text class="m" x="614" y="302">+ regulation search</text>
      <text class="l" x="614" y="338">each result returns</text><text class="l" x="614" y="352">fact_ids · units · as_of</text><text class="l" x="614" y="366">data_origin · map_targets</text><text class="l" x="614" y="388">arguments are map ids</text><text class="l" x="614" y="402">(GW-NG-X00, ID&gt;MM, NG);</text><text class="l" x="614" y="416">a wrong shape is refused</text>
      <path class="e" d="M544 135H600" marker-end="url(#a4)"/>
      <path class="e" d="M544 244H600" marker-end="url(#a4)"/>
      <path class="e ok" d="M600 372H544" marker-end="url(#a4)"/><text class="l lc" x="572" y="364" style="fill:var(--det)">facts</text>

      <rect class="frame geo" x="850" y="52" width="190" height="390"/>
      <text class="b" x="862" y="74">geo_evidence</text><text class="m" x="862" y="90">pure functions, shared</text><text class="m" x="862" y="104">with the cockpit routes</text>
      <path class="e" d="M810 200H850" marker-end="url(#a4)"/>
      <rect class="n geo" x="862" y="116" width="166" height="52"/>
      <text class="b" x="872" y="136">geo engine snapshot</text><text class="m" x="872" y="152">logins, hotspots</text>
      <rect class="n geo" x="862" y="178" width="166" height="106"/>
      <text class="b" x="872" y="198">BigQuery Graph</text><text class="m" x="872" y="214">named queries only:</text><text class="m" x="872" y="228">account_neighbourhood</text><text class="m" x="872" y="242">exit_ring</text><text class="m" x="872" y="256">country_links</text><text class="m" x="872" y="272">DuckDB double fallback</text>
      <rect class="n ext" x="862" y="294" width="166" height="72"/>
      <text class="b" x="872" y="314">warm_reference</text><text class="m" x="872" y="330">FATF · EU · Basel</text><text class="m" x="872" y="344">ICIJ · Overture</text><text class="m" x="872" y="358">rows carry source + as-of</text>
      <rect class="n geo" x="862" y="376" width="166" height="56"/>
      <text class="b" x="872" y="396">netintel</text><text class="m" x="872" y="412">IP → country, network</text><text class="m" x="872" y="426">none_listed ≠ clean</text>

      <path class="e" d="M415 442V480" marker-end="url(#a4)"/><text class="l" x="423" y="466">turn proposes a hold or drafts a SAR</text>
      <rect class="n det" x="20" y="480" width="190" height="112"/>
      <text class="b" x="30" y="500">Replay</text><text class="m" x="30" y="518">POST evidence/{id}/replay</text><text class="m" x="30" y="534">re-derives each figure</text><text class="m" x="30" y="548">through the port, as the</text><text class="m" x="30" y="562">caller: equal, differs,</text><text class="m" x="30" y="576">failed, not replayed</text>
      <rect class="n gov" x="270" y="480" width="290" height="112"/>
      <text class="b" x="282" y="500">Evidence bundle · evidence/</text><text class="m" x="282" y="518">question + answer + every tool result</text><text class="m" x="282" y="532">as canonical JSON, id = SHA-256</text><text class="m" x="282" y="546">write-once; reading re-hashes it and</text><text class="m" x="282" y="560">a mismatch is refused as tampered</text>
      <path class="e d" d="M210 536H270" marker-end="url(#a4)"/>
      <path class="e back" d="M560 536H600" marker-end="url(#a4)"/>
      <rect class="n gov" x="600" y="480" width="210" height="112"/>
      <text class="b" x="612" y="500">Intent hub</text><text class="m" x="612" y="518">stage request carries</text><text class="m" x="612" y="532">evidence_bundle_id →</text><text class="m" x="612" y="546">evidence_refs, covered by</text><text class="m" x="612" y="560">the KMS signature; the</text><text class="m" x="612" y="574">proposer cannot approve</text>
      <rect class="n" x="850" y="480" width="190" height="112"/>
      <text class="b" x="862" y="500">Honesty rules</text><text class="m" x="862" y="518">not assessable ≠ clean</text><text class="m" x="862" y="532">unlisted ≠ safe</text><text class="m" x="862" y="546">hotspots: binomial test,</text><text class="m" x="862" y="560">BH 5% FDR, "could be chance"</text><text class="m" x="862" y="574">never judge by origin</text>
    </svg>