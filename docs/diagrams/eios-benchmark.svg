<svg xmlns="http://www.w3.org/2000/svg" width="24cm" height="10cm" viewBox="0 0 2400 1000" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="2400" height="1000" fill="#f7f7f5"/>
<text x="40" y="80" font-size="54" font-weight="700" fill="#1b1d21" text-anchor="start">Measured, not claimed: 246 live turns, 96.8% of figures traced to an engine.</text>
<text x="40" y="122" font-size="27" font-weight="400" fill="#464a51" text-anchor="start">Gemini 3.5 Flash-Lite on Google Cloud, 18 October. Synthetic seeded worlds, not production data. The limits are on the slide.</text>
<rect x="40.0" y="150" width="559.0" height="540" fill="#ececec" stroke="#cfd0d2" stroke-width="1.5"/>
<text x="66.0" y="200" font-size="30" font-weight="700" fill="#1b1d21" text-anchor="start" letter-spacing="1.2">ANSWER QUALITY</text>
<text x="66.0" y="236" font-size="23" font-weight="400" fill="#464a51" text-anchor="start">246 live turns on Gemini</text>
<line x1="66.0" y1="258" x2="573.0" y2="258" stroke="#cfd0d2" stroke-width="2"/>
<text x="66.0" y="330" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">200 / 213</text>
<text x="66.0" y="366" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">verdicts passed</text>
<text x="66.0" y="446" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">96.8%</text>
<text x="66.0" y="482" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">of figures traced to an engine result</text>
<text x="66.0" y="562" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">40 / 42</text>
<text x="66.0" y="598" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">on the held-out set, run once</text>
<rect x="627.0" y="150" width="559.0" height="540" fill="#ececec" stroke="#cfd0d2" stroke-width="1.5"/>
<text x="653.0" y="200" font-size="30" font-weight="700" fill="#1b1d21" text-anchor="start" letter-spacing="1.2">SPEED</text>
<text x="653.0" y="236" font-size="23" font-weight="400" fill="#464a51" text-anchor="start">Same live run, and the deployed app</text>
<line x1="653.0" y1="258" x2="1160.0" y2="258" stroke="#cfd0d2" stroke-width="2"/>
<text x="653.0" y="330" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">2.7 s</text>
<text x="653.0" y="366" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">median turn, 4.6 s at p95, 0 timeouts</text>
<text x="653.0" y="446" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">&lt; 1 ms</text>
<text x="653.0" y="482" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">what-if shock, against a 200 ms budget</text>
<text x="653.0" y="562" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">1.7 s</text>
<text x="653.0" y="598" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">page load (LCP) on Cloud Run, CLS 0.006</text>
<rect x="1214.0" y="150" width="559.0" height="540" fill="#ececec" stroke="#cfd0d2" stroke-width="1.5"/>
<text x="1240.0" y="200" font-size="30" font-weight="700" fill="#1b1d21" text-anchor="start" letter-spacing="1.2">ENGINES VS PLANTED TRUTH</text>
<text x="1240.0" y="236" font-size="23" font-weight="400" fill="#464a51" text-anchor="start">Synthetic worlds with a known answer</text>
<line x1="1240.0" y1="258" x2="1747.0" y2="258" stroke="#cfd0d2" stroke-width="2"/>
<text x="1240.0" y="330" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">0.74×</text>
<text x="1240.0" y="366" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">forecast error vs a naive guess; 90%</text>
<text x="1240.0" y="395" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">interval held 87%</text>
<text x="1240.0" y="475" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">1.5%</text>
<text x="1240.0" y="511" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">largest error in the causal fit</text>
<text x="1240.0" y="591" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">1.00 / 0.99</text>
<text x="1240.0" y="627" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">precision and recall, ring lens</text>
<rect x="1801.0" y="150" width="559.0" height="540" fill="#ececec" stroke="#cfd0d2" stroke-width="1.5"/>
<text x="1827.0" y="200" font-size="30" font-weight="700" fill="#1b1d21" text-anchor="start" letter-spacing="1.2">SAFETY AND INTEGRITY</text>
<text x="1827.0" y="236" font-size="23" font-weight="400" fill="#464a51" text-anchor="start">Checks the system enforces</text>
<line x1="1827.0" y1="258" x2="2334.0" y2="258" stroke="#cfd0d2" stroke-width="2"/>
<text x="1827.0" y="330" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">15 / 15</text>
<text x="1827.0" y="366" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">red-team probes passed (a small set)</text>
<text x="1827.0" y="446" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">11 / 11</text>
<text x="1827.0" y="482" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">planted data breaches quarantined, 0</text>
<text x="1827.0" y="511" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">healthy events refused</text>
<text x="1827.0" y="591" font-size="68" font-weight="700" fill="#1a56c4" text-anchor="start">2,807 / 2,807</text>
<text x="1827.0" y="627" font-size="24" font-weight="400" fill="#1b1d21" text-anchor="start">rows restored in the recovery drill</text>
<rect x="40" y="714" width="2320" height="240" fill="#ffffff" stroke="#1b1d21" stroke-width="2.5"/>
<text x="68" y="760" font-size="28" font-weight="700" fill="#1b1d21" text-anchor="start" letter-spacing="1.5">KNOWN LIMITS</text>
<text x="398" y="760" font-size="25" font-weight="400" fill="#464a51" text-anchor="start">Published, not hidden</text>
<text x="68.0" y="832" font-size="46" font-weight="700" fill="#1b1d21" text-anchor="start">13</text>
<text x="68.0" y="866" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">of 213 verdicts failed; the reasons are</text>
<text x="68.0" y="895" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">published</text>
<line x1="616.0" y1="784" x2="616.0" y2="934" stroke="#cfd0d2" stroke-width="2"/>
<text x="634.0" y="832" font-size="46" font-weight="700" fill="#1b1d21" text-anchor="start">20–33%</text>
<text x="634.0" y="866" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">of eval turns ran on fixture data, not</text>
<text x="634.0" y="895" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">the engines</text>
<line x1="1182.0" y1="784" x2="1182.0" y2="934" stroke="#cfd0d2" stroke-width="2"/>
<text x="1200.0" y="832" font-size="46" font-weight="700" fill="#1b1d21" text-anchor="start">Not measured</text>
<text x="1200.0" y="866" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">cost per turn and time saved per case</text>
<line x1="1748.0" y1="784" x2="1748.0" y2="934" stroke="#cfd0d2" stroke-width="2"/>
<text x="1766.0" y="832" font-size="46" font-weight="700" fill="#1b1d21" text-anchor="start">No load test</text>
<text x="1766.0" y="866" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">Cloud Run under concurrent users is</text>
<text x="1766.0" y="895" font-size="24" font-weight="400" fill="#464a51" text-anchor="start">untested</text>
<text x="40" y="986" font-size="19" font-weight="400" fill="#464a51" text-anchor="start">Sources: live and held-out runs in evals/reports, engine, operations and geo docs, Cloud Run web-vitals report (one page, one machine). Counts are verdicts, not turns.</text>
</svg>