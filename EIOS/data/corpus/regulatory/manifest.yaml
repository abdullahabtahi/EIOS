# Regulatory knowledge corpus: provenance manifest (v1, acquired 2026-10-14).
#
# PDFs live in ./raw/ and are NOT committed (.gitignore). Re-fetch from `source_url` and verify `sha256`.
# Use rule (user decision, 2026-10-14): the best-value use case that has publicly attainable data.
# Use case: AML investigator drafts an STR/SAR and justifies a disposition with citations to the rules and
# red-flag typologies that apply to the entity's licensing jurisdiction.
#
# licence_state values: `unverified` = published openly by the regulator but no reuse terms could be retrieved
# (do not redistribute; private retrieval index and short attributed quotations only); `public_domain` = US
# federal work. Nothing here is a legal opinion. Open item D-3: confirm reuse terms before any public deployment
# shows more than short attributed excerpts.
#
# Deriv's licensing entities below come from third-party listings (not a regulator register) and MUST be
# verified against each regulator's public register before they are relied on: [ASSUMPTION].

