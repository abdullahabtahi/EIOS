# SonarQube Project Configuration
sonar.projectKey=eios-platform
sonar.projectName=eios-platform

# Disjoint sources and tests
sonar.sources=src,web-prototype/src/app,web-prototype/src/components,web-prototype/src/lib,web-prototype/src/types,infra
sonar.tests=tests,web-prototype/src/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/.venv/**,**/.git/**,**/.pytest_cache/**,**/.ruff_cache/**,**/evals/reports/**,**/.terraform/**
sonar.scm.disabled=true

# Python Coverage Report Ingestion
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Memory allocation for JS/TS AST analysis
sonar.javascript.node.maxspace=4096

