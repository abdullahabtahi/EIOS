# Gate hook registry (F04 Evaluation Harness & Anti-Circularity Benchmark Framework).
# Registered evaluation suites across contract, eval_smoke, red_line, validation, and sealed tiers.
#
- id: eval-smoke
  tier: eval_smoke
  command: python -m evals.suites.redlines.runner
  owner_feature: F04
  report: evals/reports/red_line_summary.json

- id: redline-hallucination
  tier: red_line
  command: python -m evals.suites.redlines.test_rl1_hallucination
  owner_feature: F04
  report: evals/reports/rl_hallucination.json

- id: redline-citation
  tier: red_line
  command: python -m evals.suites.redlines.test_rl2_citation
  owner_feature: F04
  report: evals/reports/rl_citation.json

- id: redline-causal-gate
  tier: red_line
