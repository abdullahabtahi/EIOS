# The models the assistant can run on, fastest first. The first entry is the default for every turn (ADR-002 is open:
# model ids live here and in config/, nowhere else). A turn may ask for another entry by `key`; an unknown key is refused.
# `note` is what the model picker shows. Latency: median of 6 sequential calls, 2-sentence answer, thinking LOW,
# global endpoint, retries off [MEASURED] 2026-10-15: fast 1.0 s, standard 2.9 s, deep 4.6 s.
default: fast
models:
  - key: fast
    id: gemini-3.5-flash-lite
    label: 3.5 Flash-Lite
    note: Fastest answers
  - key: standard
    id: gemini-3.5-flash
    label: 3.5 Flash
    note: Balanced speed and depth
  - key: deep
    id: gemini-3.8-flash
    label: 3.8 Flash
    note: All-around help
