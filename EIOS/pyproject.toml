[project]
name = "eios"
description = "EIOS platform foundations (F00): gates, environments, LLM gateway, labels, decisions, observability"
requires-python = ">=3.14"
version = "0.0.0"
dependencies = [
    "cryptography>=43.0.0",
    "duckdb>=1.1.0",
    "faker>=24.0.0",
    "fastapi>=0.133.0,<0.142.2",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-kms>=3.0.0",
    "google-cloud-pubsub>=2.19.0",
    "google-adk[gcp]==2.11.0",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "opentelemetry-api>=1.39.0,<=1.42.1",
    "opentelemetry-sdk>=1.39.0,<=1.42.1",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.54.0",
    "google-cloud-bigquery>=3.25.0",
    "limits>=3.13",
    "pycountry>=26.2.16",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-firestore>=2.34.0",
    "google-cloud-secret-manager>=2.31.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib --strict-markers -ra"
# Fixture projects are inputs to the gate proofs, never collected by the outer run.
norecursedirs = ["tests/fixtures", ".*", "build", "dist", "node_modules", "venv", "__pycache__"]
markers = [
    "requires_network: needs outbound network access",
    "requires_emulator: needs a local cloud-service emulator",
    "requires_cloud: needs a real cloud project",
]

[tool.coverage.run]
source = ["src/eios", "tools", "services"]
branch = true

[tool.coverage.report]
# [TARGET] minimum line coverage, enforced by the coverage gate
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src", "tools", "services", "tests"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# Optional cloud client libraries are imported lazily and are not installed in dev.
module = ["google.cloud.*", "google.api_core.*", "google.auth.*", "hcl2", "hcl2.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "."]
# Only the Python platform is linted; the website prototype is a separate toolchain.
extend-exclude = [".github", "web-prototype", "docs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "PLR0912", "PLR0913", "PLR0915", "TID", "RUF100"]
ignore = [
    "E501",
    # str-mixin enums keep their current str()/format() output, which is serialised into
    # contracts and the ledger; migrating to StrEnum changes it, so each move is a reviewed change.
    "UP042",
]

# Existing structural debt (complexity, argument counts, ...) carries an inline `# noqa` so that new
# violations fail while old ones are visible. RUF100 turns a noqa that no longer matches a violation
# into an error, so the debt can only shrink.
[tool.ruff.lint.isort]
known-first-party = ["eios", "evals", "tools"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is a call in an argument default by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # S311: seeded RNG for deterministic fixtures
"evals/**" = ["S101", "S105", "S106"]
# Operator scripts adjust sys.path before importing the package.
"scripts/**" = ["E402"]
# The one place telemetry SDK classes may be imported (T194); everything else uses the API.
"src/eios/common/otel.py" = ["TID251"]
# Vendor LLM SDKs live only in the gateway providers package (ADR-002).
"src/eios/llm_gateway/providers/*.py" = ["TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# [TARGET] function ceilings, mirrored in docs/conventions.md
max-statements = 50
max-branches = 12
max-args = 7

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Telemetry SDK classes are imported only in src/eios/common/otel.py (per-file ignore below).
"opentelemetry.sdk".msg = "Telemetry SDK: import it only in src/eios/common/otel.py; use opentelemetry.trace elsewhere."
# Vendor LLM SDK imports are forbidden outside src/eios/llm_gateway/providers/ (ADR-002 is open).
# [SPIKE] Equals vendor_sdk_modules in config/open_decisions.yaml (a test enforces it).
"ai21".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"anthropic".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"cohere".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"google.cloud.aiplatform".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"google.genai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"google.generativeai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"groq".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_anthropic".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_cohere".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_google_genai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_google_vertexai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_mistralai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"langchain_openai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"mistralai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"openai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."
"vertexai".msg = "Vendor SDK: import it only in src/eios/llm_gateway/providers/ (ADR-002 is open)."

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "python-hcl2>=8.1.4",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
